<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>GMAC Metalúrgica | Sistema de Gestão</title>
    <script>
      try {
        const account = JSON.parse(sessionStorage.getItem('gmac-admin-workspace') || 'null');
        const dark = sessionStorage.getItem('gmac-admin-token') && account?.userId != null && localStorage.getItem('gmac-theme-' + account.userId) === 'dark';
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        const fontSize = sessionStorage.getItem('gmac-admin-token') && account?.userId != null ? localStorage.getItem('gmac-font-size-' + account.userId) : 'default';
        document.documentElement.dataset.fontSize = ['small', 'large'].includes(fontSize) ? fontSize : 'default';
        const fontFamily = sessionStorage.getItem('gmac-admin-token') && account?.userId != null ? localStorage.getItem('gmac-font-family-' + account.userId) : 'default';
        document.documentElement.dataset.fontFamily = ['system', 'verdana', 'tahoma', 'inter', 'roboto', 'open-sans', 'montserrat', 'source-sans-3'].includes(fontFamily) ? fontFamily : 'default';
        if (dark) document.querySelector('meta[name="theme-color"]').content = '#0d1c2e';
        // The account's web font starts downloading with the page, instead of waiting for the styles and the first render.
        if (['inter', 'roboto', 'open-sans', 'montserrat', 'source-sans-3'].includes(fontFamily)) document.head.appendChild(Object.assign(document.createElement('link'), { rel: 'preload', as: 'font', type: 'font/woff2', crossOrigin: 'anonymous', href: '/fonts/' + fontFamily + '.woff2' }));
      } catch { document.documentElement.dataset.theme = 'light'; document.documentElement.dataset.fontSize = 'default'; document.documentElement.dataset.fontFamily = 'default'; }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
